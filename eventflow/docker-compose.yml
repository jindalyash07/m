version: "3.9"

services:
  zookeeper:
    image: soldevelo/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: soldevelo/kafka:3.7
    depends_on:
      - zookeeper
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"

  kafka-init:
    image: soldevelo/kafka:3.7
    depends_on:
      - kafka
    command:
      - bash
      - -lc
      - |
        until kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        for topic in order.created payment.success payment.failed notification.sent dead.letter.queue; do
          kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  order_service:
    build:
      context: .
      dockerfile: Dockerfile.order_service
    environment:
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eventflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - kafka-init
    ports:
      - "8000:8000"

  payment_service:
    build:
      context: .
      dockerfile: Dockerfile.payment_service
    environment:
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eventflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - kafka-init
    ports:
      - "8001:8001"

  notification_service:
    build:
      context: .
      dockerfile: Dockerfile.notification_service
    environment:
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eventflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - kafka-init
    ports:
      - "8002:8002"

  analytics_service:
    build:
      context: .
      dockerfile: Dockerfile.analytics_service
    environment:
      SERVICE_NAME: analytics-service
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eventflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - kafka-init
    ports:
      - "8003:8003"

volumes:
  postgres_data:
